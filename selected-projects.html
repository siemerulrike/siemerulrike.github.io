</div>

<script>
const gallery = document.querySelector('.home-gallery');
const track = document.querySelector('.gallery-progress-track');
const bar = document.querySelector('.gallery-progress-bar');

function updateGalleryProgress() {
  const maxScroll = gallery.scrollWidth - gallery.clientWidth;

  if (maxScroll <= 0) return;

  const visibleRatio = gallery.clientWidth / gallery.scrollWidth;
  const barWidth = Math.max(8, visibleRatio * 100);
  const maxBarMove = track.clientWidth - bar.offsetWidth;
  const position = (gallery.scrollLeft / maxScroll) * maxBarMove;

  bar.style.width = barWidth + '%';
  bar.style.left = position + 'px';
}

// Défilement de la galerie
gallery.addEventListener('scroll', updateGalleryProgress);

// Molette de souris
gallery.addEventListener('wheel', (event) => {
  if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
    event.preventDefault();
    gallery.scrollLeft += event.deltaY;
  }
}, { passive: false });

// Cliquer et tirer la barre
let dragging = false;

track.addEventListener('pointerdown', (event) => {
  dragging = true;
  track.setPointerCapture(event.pointerId);
  moveSlider(event);
});

track.addEventListener('pointermove', (event) => {
  if (dragging) moveSlider(event);
});

track.addEventListener('pointerup', () => {
  dragging = false;
});

track.addEventListener('pointercancel', () => {
  dragging = false;
});

function moveSlider(event) {
  const rect = track.getBoundingClientRect();
  const barWidth = bar.offsetWidth;
  const maxBarMove = track.clientWidth - barWidth;

  let position = event.clientX - rect.left - barWidth / 2;
  position = Math.max(0, Math.min(position, maxBarMove));

  const maxScroll = gallery.scrollWidth - gallery.clientWidth;

  gallery.scrollLeft = (position / maxBarMove) * maxScroll;
}

window.addEventListener('resize', updateGalleryProgress);

updateGalleryProgress();
</script>


<!-- MENU BURGER -->
<script>
document.querySelectorAll('.menu-toggle').forEach(button => {
  button.addEventListener('click', () => {
    const header = button.closest('header');
    const isOpen = header.classList.toggle('menu-open');

    button.setAttribute('aria-expanded', isOpen);
    button.innerHTML = isOpen ? '×' : '☰';
  });
});
</script>
