
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ulrike Siemer — papier mâché</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="home">

  <!-- BACKGROUND VIDEO -->
  <div class="home-video">
    <video autoplay muted loop playsinline>
      <source src="images/homepage.mp4" type="video/mp4">
    </video>
  </div>

  <!-- HEADER -->
<header class="home-header">

  <div class="home-brand">
    <a href="home.html" class="home-name">Ulrike Siemer</a>
    <span class="home-subtitle">Papier-mâché sculptures and set design</span>
  </div>

  <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
    ☰
  </button>

  <div class="home-navigation">

  <div class="language-switch">
    <a href="home.html" class="active">EN</a>
    <span>/</span>
    <a href="fr/home.html">FR</a>
  </div>

  <nav class="project-nav">
    <a href="selected-projects.html">PROJECTS</a>
    <a href="about.html">ABOUT</a>
    <a href="studio.html">IN THE STUDIO</a>
    <a href="shop.html">SHOP</a>
    <a href="contact.html">CONTACT</a>
  </nav>

</div>

</header>

<script>
  document.querySelectorAll('.menu-toggle').forEach(button => {
    button.addEventListener('click', () => {
      const header = button.closest('header');
      const isOpen = header.classList.toggle('menu-open');

      button.setAttribute('aria-expanded', isOpen);
      button.innerHTML = isOpen ? '×' : '☰';
    });
  });
</script>

</body>
</html>
