
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Ulrike Siemer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">

 <!-- HEADER -->

  <header class="page-header">

  <a href="home.html" class="page-name">ULRIKE SIEMER</a>

<button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
  ☰
</button>

  <nav class="project-nav">
    <a href="selected-projects.html">PROJECTS</a>
    <a href="about.html">ABOUT</a>
    <a href="studio.html">IN THE STUDIO</a>
    <a href="shop.html">SHOP</a>
    <a href="contact.html">CONTACT</a>
  </nav>

</header>

<section class="page-intro">
  <h1 class="page-title">Contact</h1>
</section>

<main class="contact-content">

  <div class="contact-text">

  <p class="contact-intro">
    For enquiries, collaborations or just to say hello:
  </p>

  <a href="mailto:siemerulrike@gmail.com" class="contact-link contact-email">
    siemerulrike@gmail.com
  </a>

  <a href="https://www.instagram.com/ulrikesie/"
     target="_blank"
     rel="noopener noreferrer"
     class="contact-link">
    Instagram — @ulrikesie
  </a>


</div>

<div class="contact-image">
  <video autoplay muted loop playsinline preload="metadata">
    <source src="images/contact.mp4" type="video/mp4">
  </video>

  <p class="contact-note">
    Looking forward to hearing from you!
  </p>
</div>

</main>

<script>
  document.querySelectorAll('.menu-toggle').forEach(button => {
    button.addEventListener('click', () => {
      const header = button.closest('header');
      const isOpen = header.classList.toggle('menu-open');

      button.setAttribute('aria-expanded', isOpen);
      button.innerHTML = isOpen ? '×' : '☰';
    });
  });
</script>
</body>
</html>
